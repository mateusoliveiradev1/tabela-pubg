name: CI

on:
  push:
    branches: [main, "phase/02-identidade-organizacoes-e-autorizacao"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and affected build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository policies
        run: pnpm verify:secrets && pnpm verify:migrations && pnpm verify:compose && pnpm lint:boundaries
      - name: Validate affected packages
        run: pnpm turbo run lint typecheck test build --affected

  phase2-integration:
    name: Phase 2 ${{ matrix.suite }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, concurrent]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pubg_camp_test
          POSTGRES_USER: pubg
          POSTGRES_PASSWORD: pubg_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pubg -d pubg_camp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pubg:pubg_ci_only@127.0.0.1:5432/pubg_camp_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build phase 2 storage dependency
        run: pnpm --filter @pubg-camp/storage build
      - name: Validate phase 2 workflow structure
        run: pnpm verify:phase2-ci
      - name: Run PostgreSQL and Redis preflight
        run: pnpm phase2:integration:preflight
      - name: Run phase 2 integration suite with redacted output
        if: matrix.suite == 'integration'
        shell: bash
        run: |
          set -o pipefail
          pnpm phase2:integration 2>&1 \
            | sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1[REDACTED]@#g; s#(redis(s)?://)[^@[:space:]]+@#\1[REDACTED]@#g' \
            | tee phase2-integration.log
      - name: Run phase 2 concurrency suite with redacted output
        if: matrix.suite == 'concurrent'
        shell: bash
        run: |
          set -o pipefail
          pnpm phase2:concurrent 2>&1 \
            | sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1[REDACTED]@#g; s#(redis(s)?://)[^@[:space:]]+@#\1[REDACTED]@#g' \
            | tee phase2-concurrent.log
      - name: Upload redacted phase 2 logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase2-${{ matrix.suite }}-logs
          path: phase2-${{ matrix.suite }}.log
          if-no-files-found: error
          retention-days: 7

  phase2-e2e:
    name: Phase 2 browser E2E
    needs: [quality, phase2-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pubg_camp_test
          POSTGRES_USER: pubg
          POSTGRES_PASSWORD: pubg_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pubg -d pubg_camp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pubg:pubg_ci_only@127.0.0.1:5432/pubg_camp_test
      REDIS_URL: redis://127.0.0.1:6379
      E2E_PROVIDER_MODE: fake
      E2E_RUN_ID: run-ci-${{ github.run_id }}-${{ github.run_attempt }}-phase2
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build browser workspace dependencies
        run: pnpm turbo run build --filter=@pubg-camp/web^...
      - name: Build authorization dependency for API security contracts
        run: pnpm turbo run build --filter=@pubg-camp/authorization...
      - name: Validate final phase 2 workflow structure
        run: pnpm verify:phase2-ci
      - name: Run mandatory PostgreSQL and Redis preflight
        run: pnpm phase2:integration:preflight
      - name: Run mandatory phase 2 security contracts
        run: >-
          pnpm --filter @pubg-camp/authorization exec vitest run
          src/authorization.spec.ts &&
          pnpm --filter @pubg-camp/api exec vitest run
          src/authorization/permission.guard.spec.ts
          src/identity/adapters/discord-oauth.pkce.spec.ts &&
          pnpm --filter @pubg-camp/web exec vitest run
          "src/app/api/platform/[...path]/route.spec.ts"
      - name: Install official Chromium and operating-system dependencies
        run: pnpm --filter @pubg-camp/web exec playwright install --with-deps chromium
      - name: Run mandatory real-stack phase 2 runtime
        run: pnpm test:e2e:runtime
      - name: Run phase 2 browser smoke first
        run: pnpm --filter @pubg-camp/web test:e2e:smoke
      - name: Run complete phase 2 browser suite
        run: pnpm --filter @pubg-camp/web test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phase2-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Image ${{ matrix.app }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: docker/web.Dockerfile
            build_args: ""
          - app: api
            dockerfile: docker/service.Dockerfile
            build_args: APP=api
          - app: worker
            dockerfile: docker/service.Dockerfile
            build_args: APP=worker
          - app: discord-bot
            dockerfile: docker/service.Dockerfile
            build_args: APP=discord-bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          tags: pubg-camp/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
