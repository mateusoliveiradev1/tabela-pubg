packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

catalog:
  '@types/node': 26.2.0
  pino: 10.3.1
  typescript: 6.0.3
  vitest: 4.1.11
  zod: 4.4.3

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1115.0'
  - '@aws-sdk/s3-request-presigner@3.1115.0'
  - resend@6.21.0

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
