name: pubg-camp

x-app-common: &app-common
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  networks: [backend]

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pubg_camp}
      POSTGRES_USER: ${POSTGRES_USER:-pubg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubg_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pubg_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pubg_local_only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  api:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { APP: api }
    environment:
      SERVICE_NAME: api
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://pubg:pubg_local_only@postgres:5432/pubg_camp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: ["node", "../../scripts/migrate-and-start.mjs", "api"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      SERVICE_NAME: web
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://pubg:pubg_local_only@postgres:5432/pubg_camp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  worker:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { APP: worker }
    environment:
      SERVICE_NAME: worker
      PORT: 3002
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  discord-bot:
    <<: *app-common
    profiles: [discord]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { APP: discord-bot }
    environment:
      SERVICE_NAME: discord-bot
      PORT: 3003
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-replace_with_a_development_bot_token}
    ports: ["127.0.0.1:3003:3003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  backend:
    internal: false
